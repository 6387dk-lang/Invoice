{% extends "base.html" %}{% block content %}<h2>Products / Services</h2><div class="card p-4 mb-4"><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<div class="col-md-4"><input class="form-control" name="name" placeholder="Product / Service" required></div><div class="col-md-2"><input class="form-control" name="hsn_sac" placeholder="HSN/SAC"></div>
<div class="col-md-2"><input class="form-control" name="rate" type="number" step="0.01" placeholder="Rate" required></div><div class="col-md-2"><input class="form-control" name="gst_percent" type="number" step="0.01" value="18"></div>
<div class="col-md-2"><button class="btn btn-primary">Add</button></div></form></div>
<table class="table bg-white"><tr><th>Name</th><th>HSN/SAC</th><th>Rate</th><th>GST</th><th></th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.hsn_sac}}</td><td>Rs. {{'%.2f'|format(r.rate)}}</td><td>{{r.gst_percent}}%</td><td><form method="post" action="{{url_for('product_delete',id=r.id)}}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
