{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-5"><div class="card p-4 mt-5">
<h3 class="mb-4">Login</h3><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username</label><input class="form-control mb-3" name="username" required autocomplete="username">
<label>Password</label><input class="form-control mb-3" name="password" type="password" required autocomplete="current-password">
<button class="btn btn-primary w-100">Login</button></form><p class="text-muted mt-3 mb-0">New here? <a href="{{ url_for('signup') }}">Create a free account</a></p></div></div></div>{% endblock %}
