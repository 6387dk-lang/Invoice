{% extends "base.html" %}{% block content %}<h2>User Management</h2><div class="card p-4 mb-4"><form method="post" action="{{ url_for('add_user') }}" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<div class="col-md-3"><input class="form-control" name="username" placeholder="Username" required minlength="3"></div><div class="col-md-3"><input class="form-control" name="password" placeholder="Temporary password (8+ chars)" type="password" required minlength="8"></div>
<div class="col-md-2"><select class="form-select" name="role"><option>User</option><option>Admin</option></select></div><div class="col-md-2"><button class="btn btn-primary">Create User</button></div></form></div>
<table class="table bg-white"><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Plan</th><th></th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.username}}</td><td>{{r.email or '-'}}</td><td>{{r.role}}</td><td>{{r.plan_status}}</td><td>{% if r.id != session.get('user_id') and r.role!='Admin' %}<form method="post" action="{{url_for('user_delete',id=r.id)}}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="btn btn-sm btn-danger">Delete</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
