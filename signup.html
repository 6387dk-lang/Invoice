{% extends "base.html" %}{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="card p-4 mt-4"><h2>Create your account</h2><p class="text-muted">Start your free trial: 7 days or 5 invoices, whichever comes first.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username</label><input class="form-control mb-3" name="username" required minlength="3" autocomplete="username"><label>Email (optional)</label><input class="form-control mb-3" type="email" name="email" autocomplete="email"><label>Password</label><input class="form-control mb-3" type="password" name="password" required minlength="8" autocomplete="new-password"><button class="btn btn-primary w-100">Create free account</button></form><p class="mt-3 mb-0">Already registered? <a href="{{url_for('login')}}">Login</a></p></div></div></div>{% endblock %}
