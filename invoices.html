{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h2>Invoices</h2><a class="btn btn-primary" href="{{url_for('new_invoice')}}">+ New Invoice</a></div>
<form class="input-group my-3"><input class="form-control" name="q" value="{{q}}" placeholder="Search invoice/customer"><button class="btn btn-outline-secondary">Search</button></form>
<table class="table bg-white"><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Due</th><th>Total</th><th>Status</th><th></th></tr>
{% for r in rows %}<tr><td>{{r.invoice_number}}</td><td>{{r.customer}}</td><td>{{r.invoice_date}}</td><td>{{r.due_date}}</td><td>Rs. {{'%.2f'|format(r.grand_total)}}</td><td>{{r.payment_status}}</td><td><a class="btn btn-sm btn-outline-primary" href="{{url_for('invoice_pdf',id=r.id)}}">PDF</a></td></tr>{% endfor %}</table>{% endblock %}
